name: Idea or wish
description: Suggest something that would make Tremors better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is hard today?
      description: Describe the situation. Who uses the computer and what goes wrong?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
